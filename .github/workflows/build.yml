name: Build Custom Image
on:
  schedule:
    - cron: '00 09 * * *'  # Check daily at 09:00 UTC
  push:
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          # !! Add your recipes here
          - recipe-nvidia.yml
          - recipe-nvidia-open.yml
          - recipe-main.yml
          - recipe-dx.yml
          - recipe-dx-nvidia.yml
          - recipe-dx-nvidia-open.yml
    steps:
      - name: Bazzite GNOME update check
        id: check_upstream
        #if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%u)" -eq 1 ]; then
            echo "Today is the scheduled weekly forced build. Proceeding with build."
            echo "skip_build=false" >> $GITHUB_ENV
            exit 0
          fi
          
          UPSTREAM_TIME=$(skopeo inspect docker://ghcr.io/ublue-os/bazzite-gnome:stable | jq -r '.Created')
          
          DOWNSTREAM_TIME=$(skopeo inspect docker://ghcr.io/${{ github.repository_owner }}/bazzite-cosmic:latest | jq -r '.Created' 2>/dev/null || echo "1970-01-01T00:00:00Z")
          
          UPSTREAM_EPOCH=$(date -d "$UPSTREAM_TIME" +%s)
          DOWNSTREAM_EPOCH=$(date -d "$DOWNSTREAM_TIME" +%s)
          
          echo "Latest bazzite-gnome:stable built at: $UPSTREAM_TIME ($UPSTREAM_EPOCH)"
          echo "Latest bazzite-cosmic:latest built at: $DOWNSTREAM_TIME ($DOWNSTREAM_EPOCH)"

          if [ "$UPSTREAM_EPOCH" -gt "$DOWNSTREAM_EPOCH" ]; then
            echo "Upstream Bazzite GNOME is newer. Proceeding with build."
            echo "skip_build=false" >> $GITHUB_ENV
          else
            echo "Bazzite COSMIC is already up to date with upstream. Skipping build."
            echo "skip_build=true" >> $GITHUB_ENV
          fi

      # the build is fully handled by the reusable github action
      - name: Build Bazzite COSMIC
        if: env.skip_build != 'true'
        uses: blue-build/github-action@v1.13
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}

          # enabled by default, disable if your image is small and you want faster builds
          maximize_build_space: true
          # disable if it breaks something
          chunkah: true
